<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri | UKM Timekovi</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Rajdhani', sans-serif; background-color: #050b14; color: #ffffff; overflow-x: hidden; }
        .lightning-bg { background: radial-gradient(circle at 20% 30%, rgba(29, 78, 216, 0.15) 0%, transparent 40%), #050b14; }
        .glow-box { box-shadow: 0 0 25px rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); }
        .glow-text { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="lightning-bg min-h-screen flex flex-col justify-between">
    <header class="fixed top-0 left-0 w-full z-50 bg-[#050b14]/90 backdrop-blur-md border-b border-blue-900/30">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="./index.html" class="text-2xl font-bold tracking-wider text-white glow-text">D_PICT<span class="text-blue-500">.</span></a>
            <nav class="hidden md:flex items-center space-x-8 text-lg font-medium">
                <a href="./index.html" class="text-gray-300 hover:text-blue-400 transition">Home</a>
                <a href="./experience.html" class="text-blue-400 font-semibold border-b-2 border-blue-500 pb-1">Pengalaman</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow pt-32 pb-24 space-y-12 max-w-4xl mx-auto px-6 w-full">
        <div>
            <a href="./experience.html" class="inline-flex items-center text-sm font-semibold text-blue-400 hover:text-cyan-300 mb-4">
                <i class="fa fa-arrow-left mr-2"></i> Kembali ke Pengalaman
            </a>
            <h1 class="text-3xl sm:text-4xl font-bold text-white glow-text">Video Dokumentasi: UKM Timekovi</h1>
            <p class="text-gray-400 mt-2">Rekaman video kegiatan organisasi, pelatihan, dan acara kampus.</p>
        </div>

        <!-- Single Video Container Section -->
        <div class="glow-box bg-[#0b1329] rounded-2xl p-4 sm:p-6 space-y-4">
            <div class="relative w-full overflow-hidden rounded-xl border border-blue-500/20 shadow-lg" style="padding-top: 56.25%;">
                <!-- Ubah attribute 'src' di bawah ini dengan link/path video Anda (bisa file lokal .mp4 atau embed YouTube) -->
                <video controls class="absolute top-0 left-0 w-full h-full object-cover rounded-xl">
                    <source src="vid/timekovi-video.mp4" type="video/mp4">
                    Browser Anda tidak mendukung pemutaran video.
                </video>
            </div>
            <p class="text-gray-300 text-base text-center font-medium">Dokumentasi video kegiatan UKM Timekovi.</p>
        </div>
    </main>

    <footer class="bg-[#03070f] border-t border-blue-900/30 py-6 text-center text-gray-500 text-sm">
