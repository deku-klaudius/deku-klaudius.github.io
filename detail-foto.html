    <!-- Script untuk Memuat Konten & Slider Otomatis Sesuai ID Foto -->
    <script>
        const dataFoto = {
            "cileungsir": {
                title: "Kehangatan Pagi di Tanah Perbukitan",
                images: [
                    "img/events/cilengsi.jpg",
                    "img/events/cilengsi01.jpg",
                    "img/events/cilengsi02.jpg"
                ],
                content: `
                    <h2>Kehangatan Pagi di Tanah Perbukitan</h2>
                    
                    <h4>1. Judul Profesional</h4>
                    <p><strong>"Serenity of Cileungsir: The Morning Prelude"</strong></p>

                    <h4>2. Kesan Visual</h4>
                    <p>Kesan damai dan menyejukkan jiwa terpancar dari panorama matahari terbit yang berpadu dengan sejuknya kabut pagi di alam terbuka.<br>Kontras yang kuat antara siluet kendaraan di area parkir dengan hangatnya cahaya matahari terbit menciptakan atmosfer yang natural dan membumi.</p>

                    <h4>3. Arti dan Filosofi</h4>
                    <p>Arti mendalam tentang ketenangan hidup serta kesegaran awal hari yang menyapa jiwa dari kesibukan rutinitas harian.<br>Menyimbolkan harmoni antara aktivitas manusia yang berdampingan selaras dengan keindahan alam terbuka.</p>

                    <h4>4. Teknik Pengambilan Foto</h4>
                    <ul>
                        <li><strong>Framing Alami:</strong> Menggunakan dedaunan di sisi kanan dan pagar kayu di sisi kiri sebagai bingkai alami (<em>natural framing</em>) untuk memperkuat dimensi kedalaman (<em>depth</em>).</li>
                        <li><strong>Silhouette & Backlighting:</strong> Memanfaatkan pencahayaan dari belakang (<em>backlight</em>) matahari terbit untuk membentuk siluet objek di bagian foreground dan midground secara dramatis.</li>
                        <li><strong>Eye-Level Angle:</strong> Mengambil sudut pandang sejajar mata untuk memberikan kesan realistis seolah pengamat hadir langsung di lokasi tersebut.</li>
                    </ul>
                `
            },
            "jakarta": {
                title: "Cakrawala Pagi Metropolitan",
                images: [
                    "img/events/jakarta.jpg",
                    "img/events/jakarta01.jpg"
                ],
                content: `
                    <h2>Cakrawala Pagi Metropolitan</h2>
                    
                    <h4>1. Judul Profesional</h4>
                    <p><strong>"The Urban Tapestry: Jakarta's Duality at Dawn"</strong></p>

                    <h4>2. Kesan Visual</h4>
                    <p>Kesan luas dan menenangkan terpancar dari bentang langit pagi yang menyapa kesibukan kota metropolitan.<br>Foto ini secara efektif memadukan kehangatan cahaya keemasan matahari terbit di ufuk kiri dengan kesejukan warna biru cerah di sisi kanan, menciptakan garis pemisah alami yang indah di langit.<br>Terdapat keseimbangan visual yang menarik antara lanskap atap bangunan padat dengan barisan gedung pencakar langit yang modern dan teratur.</p>

                    <h4>3. Arti dan Filosofi</h4>
                    <p>Arti mendalam tentang awal baru yang penuh harapan di balik padatnya aktivitas serta dinamika kehidupan urban.<br>Momen "golden hour" ini melambangkan transisi, awal yang baru, dan optimisme kota yang bersiap memulai hari setelah malam berlalu.</p>

                    <h4>4. Teknik Pengambilan Foto</h4>
                    <ul>
                        <li><strong>Format Ultra-Wide Panorama:</strong> Menggunakan teknik <em>stitching</em> beberapa foto untuk menangkap bidang pandang yang sangat luas (<em>field of view</em>).</li>
                        <li><strong>Pemilihan Waktu (Timing) Tepat:</strong> Pengambilan gambar dilakukan saat fajar (<em>sunrise</em>), memanfaatkan cahaya samping dari matahari rendah untuk menonjolkan tekstur bangunan.</li>
                        <li><strong>Pencahayaan Seimbang (Exposure Balancing):</strong> Penggunaan teknik untuk mengontrol <em>dynamic range</em> yang ekstrem agar detail terang dan gelap tetap terjaga.</li>
                        <li><strong>Komposisi Berlapis (Layered Composition):</strong> Menempatkan elemen <em>foreground</em> untuk membingkai pemandangan dan menciptakan kedalaman visual.</li>
                    </ul>
                `
            },
            "menteng": {
                title: "Keagungan Sang Pahlawan di Ruang Terbuka",
                images: [
                    "img/events/menteng.jpg",
                    "img/events/menteng01.jpg"
                ],
                content: `
                    <h2>Keagungan Sang Pahlawan di Ruang Terbuka</h2>
                    
                    <h4>1. Judul Profesional</h4>
                    <p><strong>"The Monumental Rebirth: Arjuna Wiwaha from the Ground Up"</strong></p>

                    <h4>2. Kesan Visual</h4>
                    <p>Kesan megah dan klasik terpancar dari monumen bersejarah yang berdiri kokoh di tengah rimbunnya lanskap hijau kota.<br>Foto ini menciptakan kesan megah yang tidak terduga dengan menjadikan hamparan tanaman hias di <em>foreground</em> sebagai titik fokus utama.<br>Kontras visual antara kelembutan tekstur dedaunan dengan kekokohan patung perunggu serta kesejukan air mancur.</p>

                    <h4>3. Arti dan Filosofi</h4>
                    <p>Arti mendalam tentang penghormatan abadi terhadap jasa pahlawan bangsa serta pelestarian ruang hijau publik di tengah modernitas.<br>Mengajarkan untuk mengapresiasi keindahan dari hal-hal kecil di sekitar kita sebelum melihat objek yang lebih besar.</p>

                    <h4>4. Teknik Pengambilan Foto</h4>
                    <ul>
                        <li><strong>Extreme Low-Angle Shot:</strong> Kamera diletakkan sangat rendah, menciptakan distorsi perspektif yang membuat tanaman di <em>foreground</em> terlihat raksasa.</li>
                        <li><strong>Deep Depth of Field:</strong> Seluruh pemandangan dari tanaman hingga patung tetap terlihat tajam menggunakan bukaan lensa tinggi.</li>
                        <li><strong>Framing Alami:</strong> Dedaunan di sisi kiri dan kanan secara efektif membingkai patung monumen.</li>
                        <li><strong>Pencahayaan Natural (Soft Overcast Light):</strong> Kondisi cuaca berawan memberikan cahaya lembut yang merata.</li>
                    </ul>
                `
            },
            "bundaranhi": {
                title: "Denyut Malam Ibu Kota",
                images: [
                    "img/events/bundaranhi.jpeg",
                    "img/events/bundaranhi01.jpg",
                    "img/events/bundaranhi02.jpg",
                    "img/events/bundaranhi03.jpg"
                ],
                content: `
                    <h2>Denyut Malam Ibu Kota</h2>
                    
                    <h4>1. Judul Profesional</h4>
                    <p><strong>"Street Photography menangkap momen keramaian kota di malam hari yang memancarkan energi kehidupan urban tanpa henti"</strong></p>

                    <h4>2. Kesan Visual</h4>
                    <p>Kehidupan tidak pernah benar-benar berhenti di bawah kerlap-kerlip lampu jalan dan bisingnya kendaraan ibu kota.<br>Memancarkan energi malam hari kota besar yang sibuk, memadukan lampu-lampu buatan perkotaan dengan aktivitas komuter yang padat.<br>Tercipta dari pendaran lampu jalan serta papan reklame (<em>billboard</em>) yang terang melawan gelapnya langit malam khas lanskap urban.</p>

                    <h4>3. Arti dan Filosofi</h4>
                    <p>Denyut Nadi Mobilitas Publik: Menyimbolkan kehidupan kaum urban yang bergerak cepat dan ketergantungan pada transportasi massal.<br>Kolektivitas di Tengah Modernitas: Rutinitas harian di mana individu melebur menjadi satu kesatuan arus komuter.<br>Simbiosis Teknologi dan Ruang Publik: Desain halte modern mencerminkan transformasi tata kota menuju era metropolitan.</p>

                    <h4>4. Teknik Pengambilan Foto</h4>
                    <ul>
                        <li><strong>Wide-Angle Composition:</strong> Menggunakan lensa sudut lebar untuk merangkum area halte dan jalan raya yang luas.</li>
                        <li><strong>Leading Lines & Perspective:</strong> Memanfaatkan garis arsitektur dan struktur lantai untuk mengarahkan pandangan mata.</li>
                        <li><strong>Layering:</strong> Menempatkan bodi bus besar di sisi kiri sebagai elemen lapis depan.</li>
                        <li><strong>Ambient Night Exposure:</strong> Pengaturan pencahayaan cermat untuk menangkap lampu neon tanpa kehilangan detail pada bayangan gelap.</li>
                    </ul>
                `
            }
        };

        // Ambil parameter ID dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const fotoId = urlParams.get('id');

        if (fotoId && dataFoto[fotoId]) {
            const data = dataFoto[fotoId];
            document.title = data.title + " | Detail Foto";
            
            // Masukkan elemen slider gambar secara otomatis
            let sliderHtml = '';
            data.images.forEach(imgSrc => {
                sliderHtml += `
                    <div class="detail-slide-item">
                        <img src="${imgSrc}" alt="${data.title}">
                    </div>
                `;
            });
            $('#foto-slider').html(sliderHtml);
            
            // Masukkan konten teks
            $('#konten-detail').html(data.content);

            // Inisialisasi Owl Carousel untuk slider otomatis di halaman detail
            $('#foto-slider').owlCarousel({
                items: 1,
                loop: true,
                autoplay: true,
                autoplayTimeout: 4000,
                autoplayHoverPause: true,
                dots: true,
                nav: false,
                smartSpeed: 800
            });

        } else {
            $('#foto-slider').hide();
            $('#konten-detail').html("<h3 class='text-center mt-5'>Foto tidak ditemukan.</h3><p class='text-center'>Silakan kembali ke halaman utama untuk memilih foto yang tersedia.</p>");
        }
    </script>
